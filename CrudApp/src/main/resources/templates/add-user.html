<!DOCTYPE html>
<htmlxmlns:th="http://www.thymeleaf.org"
        xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body {
  font-family: Arial, Helvetica, sans-serif;
  background-color: black;
}

* {
  box-sizing: border-box;
}

/* Add padding to containers */
.container {
  padding: 16px;
  background-color: white;
}

/* Full-width input fields */
input[type=text], input[type=password] {
  width: 100%;
  padding: 15px;
  margin: 5px 0 22px 0;
  display: inline-block;
  border: none;
  background: #f1f1f1;
}

input[type=text]:focus, input[type=password]:focus {
  background-color: #ddd;
  outline: none;
}

/* Overwrite default styles of hr */
hr {
  border: 1px solid #f1f1f1;
  margin-bottom: 25px;
}

/* Set a style for the submit button */
.registerbtn {
  background-color: #04AA6D;
  color: white;
  padding: 16px 20px;
  margin: 8px 0;
  border: none;
  cursor: pointer;
  width: 100%;
  opacity: 0.9;
}

.registerbtn:hover {
  opacity: 1;
}

/* Add a blue text color to links */
a {
  color: dodgerblue;
}

/* Set a grey background color and center the text of the "sign in" section */
.signin {
  background-color: #f1f1f1;
  text-align: center;
}

.error {color:red}
</style>
<title>Add User</title>
</head>
<body>

<form th:action="@{/addUser/processingTheAddUser}" th:object="${webUser}" method="POST">
  <div class="container">
    <h1>Add new User</h1>
    <p>Please fill in this form to create a new User.</p>
    <hr>

    <label><b>User name</b></label>
    <input type="text" th:field="*{userName}" placeholder="Enter User name" required>
    <span th:if="${#fields.hasErrors('userName')}" th:errors="*{userName}" class="errors"></span>

    <label ><b>Password</b></label>
    <input type="password" th:field="*{password}" placeholder="Enter Password" required>
    <span th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="errors"></span>

    <label ><b>First Name</b></label>
    <input type="text" th:field="*{firstName}" placeholder="Enter First Name" required>
    <span th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}" class="errors"></span>

    <label ><b>Last Name</b></label>
    <input type="text" th:field="*{lastName}" placeholder="Enter Last Name" required>
    <span th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}" class="errors"></span>

    <label ><b>email</b></label>
    <input type="email" th:field="*{email}" placeholder="Enter Email" required>
    <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="errors"></span>


    <button type="submit" class="registerbtn">Add user</button>
  </div>
  
</form>

</body>
</html>
